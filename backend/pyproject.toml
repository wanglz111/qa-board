[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "testdeck-backend"
version = "0.1.0"
description = "Standalone TestDeck API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pillow==11.3.0",
    "psycopg[binary]==3.2.9",
    "python-multipart==0.0.20",
    "pytest==8.4.2",
    "sqlalchemy==2.0.43",
    "uvicorn==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
