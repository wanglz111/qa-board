name: Publish TestDeck images

# Publishes the two images from this repository only. The workflow never checks
# out or pushes to the legacy Lark repository, and it never needs legacy
# credentials: the images are built from this checkout and tagged by version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testdeck
          POSTGRES_PASSWORD: testdeck
          POSTGRES_DB: testdeck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testdeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://testdeck:testdeck@127.0.0.1:5433/testdeck_test
        run: .venv/bin/python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

      - name: Validate Compose interpolation without credentials
        run: docker compose --env-file .env.example -f compose.yaml config

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: backend
            dockerfile: backend/Dockerfile
          - image: web
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/qa-board-${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/qa-board-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
